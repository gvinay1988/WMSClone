
<div class="product-by-supplier-page">
  <div class="page-heading">
    <h1>Product by Supplier</h1>
    <p>Select a supplier and product to create an assignment.</p>
  </div>

  <div *ngIf="loading" class="loading-state">
    Loading supplier and product details...
  </div>

  <form [formGroup]="productBySupplierForm">
    <div class="workspace">
      <section class="panel supplier-panel">
        <div class="panel-heading">
          <div>
            <h2>Suppliers</h2>
            <span>Supplier details</span>
          </div>
          <i class="pi pi-building"></i>
        </div>

        <div class="form-grid">
          <div class="field field-full">
            <label for="supplierId">Supplier ID <span class="required">*</span></label>
            <select id="supplierId" formControlName="supplierId" (change)="onSupplierChange()">
              <option value="">-- Select Supplier ID --</option>
              <option *ngFor="let supplier of suppliersList" [value]="supplier.supplierCode">
                {{ supplier.supplierCode }}
              </option>
            </select>
          </div>

          <div class="field">
            <label for="supplierName">Supplier Name</label>
            <input id="supplierName" formControlName="supplierName" readonly>
          </div>

          <div class="field">
            <label for="supplierCode">Supplier Code</label>
            <input id="supplierCode" formControlName="supplierCode" readonly>
          </div>

          <div class="field field-full">
            <label for="supplierType">Supplier Type</label>
            <input id="supplierType" formControlName="supplierType" readonly>
          </div>
        </div>
      </section>

      <section class="panel product-panel">
        <div class="panel-heading">
          <div>
            <h2>Product Details</h2>
            <span>Product details</span>
          </div>
          <i class="pi pi-box"></i>
        </div>

        <div class="form-grid">
          <div class="field field-full">
            <label for="productId">Product ID <span class="required">*</span></label>
            <select id="productId" formControlName="productId" (change)="onProductChange()">
              <option value="">-- Select Product ID --</option>
              <option *ngFor="let product of productsList" [value]="product.id">
                {{ product.id }}
              </option>
            </select>
          </div>

          <div class="field">
            <label for="productName">Product Name</label>
            <input id="productName" formControlName="productName" readonly>
          </div>

          <div class="field">
            <label for="productCategory">Category</label>
            <input id="productCategory" formControlName="category" readonly>
          </div>

          <div class="field">
            <label for="hsnCode">HSN Code</label>
            <input id="hsnCode" formControlName="hsnCode" readonly>
          </div>

          
        </div>
        <div class="actions"> 
          <button type="submit" class="save-button"
            [disabled]="saving || productBySupplierForm.invalid" (click)="saveAssignment()">
            <i class="pi pi-save"></i>
            {{ saving ? 'Saving...' : 'Save Product Assignment' }}
          </button>
        </div>
      </section>
    </div>
  </form>
</div>

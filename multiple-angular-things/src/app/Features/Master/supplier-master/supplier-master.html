<p-toast></p-toast>

<div id="inBody">

  <fieldset class="border rounded-2 p-3 pt-2" [formGroup]="supplierForm">
    <legend class="float-none w-auto px-2 fs-6 fw-normal">
      Supplier Details
    </legend>
    <div class="row g-3">
      <!-- COLUMN 1 -->
      <div class="col-md-4">

        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label"> Supplier Code <span class="text-danger">*</span> </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm"
              [class.is-invalid]="supplierForm.get('supplierCode')?.invalid && supplierForm.get('supplierCode')?.touched"
              formControlName="supplierCode" placeholder="Supplier Code">
          </div>
        </div>

        <!-- Supplier Name -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            Supplier Name <span class="text-danger">*</span>
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm"
              [class.is-invalid]="supplierForm.get('supplierName')?.invalid && supplierForm.get('supplierName')?.touched"
              formControlName="supplierName" placeholder="Supplier Name">
          </div>
        </div>

        <!-- Supplier Type -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            Supplier Type
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="supplierType"
              placeholder="Supplier Type">
          </div>
        </div>

        <!-- Contact Person -->
        <div class="row align-items-center">
          <label class="col-5 col-form-label">
            Contact Person
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="contactPerson"
              placeholder="Contact Person">
          </div>
        </div>

      </div>


      <!-- COLUMN 2 -->
      <div class="col-md-4">

        <!-- Email -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            Email
          </label>
          <div class="col-7">
            <input type="email" class="form-control form-control-sm" formControlName="email" placeholder="Email">
          </div>
        </div>

        <!-- Phone -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            Phone
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="phone" placeholder="Phone Number">
          </div>
        </div>

        <!-- Mobile -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            Mobile
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="mobile"
              placeholder="Mobile Number">
          </div>
        </div>

        <!-- GST Number -->
        <div class="row align-items-center">
          <label class="col-5 col-form-label">
            GST Number
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="gstNumber"
              placeholder="GST Number">
          </div>
        </div>

      </div>


      <!-- COLUMN 3 -->
      <div class="col-md-4">

        <!-- PAN Number -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            PAN Number
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="panNumber"
              placeholder="PAN Number">
          </div>
        </div>

        <!-- Address -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            Address
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="address" placeholder="Address">
          </div>
        </div>

        <!-- City -->
        <div class="row align-items-center mb-3">
          <label class="col-5 col-form-label">
            City
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="city" placeholder="City">
          </div>
        </div>

        <!-- Pin Code -->
        <div class="row align-items-center">
          <label class="col-5 col-form-label">
            Pin Code
          </label>
          <div class="col-7">
            <input type="text" class="form-control form-control-sm" formControlName="pinCode" placeholder="Pin Code">
          </div>
        </div>

      </div>

    </div>


    <!-- BUTTONS -->
    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-sm btn-primary" (click)="saveSupplier()"
        [disabled]="supplierForm.invalid || submitting()">
        <span *ngIf="submitting()">Saving...</span>
        <span *ngIf="!submitting()">Save Supplier</span>
      </button>
      <button type="button" class="btn btn-sm btn-secondary" (click)="clearSupplier()">
        Clear
      </button>
    </div>

  </fieldset>

  <!-- Suppliers Table -->
  <div class="mt-4">
    <h5>Suppliers List</h5>

</div>


<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(420px, 95vw)' }"
  styleClass="border-0 bg-white">

  <!-- Main Content -->
  <div class="container-fluid bg-white px-3 px-sm-4 py-3">

    <!-- Delete Icon -->
    <div class="text-center mb-3">
      <div
        class="d-inline-flex align-items-center justify-content-center
               rounded-circle bg-danger bg-opacity-10"
        style="width: 65px; height: 65px;">

        <i class="pi pi-trash text-danger fs-3"></i>

      </div>
    </div>

    <!-- Delete Text -->
    <div class="text-center">

      <h5 class="fw-bold text-dark mb-2">
        Delete Record?
      </h5>

      <p class="text-secondary mb-0">
        Are you sure you want to delete this record?
      </p>

      <p class="text-muted small mb-2">
        This action cannot be undone.
      </p>

    </div>

  </div>

  <!-- Footer -->
  <ng-template #footer>

    <div class="container-fluid bg-white px-3 px-sm-4 pb-3">

      <div class="row g-2 justify-content-center">

        <!-- No / Cancel -->
        <div class="col-12 col-sm-auto">
          <button
            type="button"
            class="btn btn-outline-secondary w-100 px-4"
            (click)="cancelDelete()">

            <i class="pi pi-times me-2"></i>
            No

          </button>
        </div>

        <!-- Yes / Delete -->
        <div class="col-12 col-sm-auto">
          <button
            type="button"
            class="btn btn-danger w-100 px-4"
            (click)="confirmDelete()">

            <i class="pi pi-check me-2"></i>
            Yes, Delete

          </button>
        </div>

      </div>

    </div>

  </ng-template>

</p-dialog>
